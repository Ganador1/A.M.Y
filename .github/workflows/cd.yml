name: CD (Release)

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v1.0.0). Required for manual runs."
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  verify:
    name: Pre-release verification (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install runtime and validated test dependencies
        run: |
          python -m pip install '.[test]' -r scripts/release/requirements-validation.txt
          echo "AMY_ATLAS_PYTHON=$(command -v python)" >> "$GITHUB_ENV"

      - name: Verify clean checkout before tests generate local state
        run: python scripts/diagnostics/verify_secret_hygiene.py --strict

      - name: Ruff correctness gate
        run: |
          ruff check \
            amy.py core cognition memory senses communication evolution sandbox skills tests \
            --select E9,F63,F7,F82 --output-format=github

      - name: Run all regression tests without external services
        run: |
          python -m pytest \
            tests -m "not network" -q --tb=short -p no:cacheprovider

      - name: Run focused Atlas evidence-boundary tests
        run: |
          PYTHONPATH=atlas python -m pytest \
            atlas/tests/unit/orchestration/test_tool_evidence_external_science.py \
            --confcutdir=atlas/tests/unit/orchestration \
            -q --tb=short -p no:cacheprovider

      - name: Verify the selected deterministic Atlas tool suite
        run: python scripts/diagnostics/verify_atlas_tools.py

      - name: Verify observed climate data and failure boundaries
        run: PYTHONPATH=atlas python -m pytest atlas/tests/unit/test_climate_loop.py --confcutdir=atlas/tests/unit -q

      - name: Recompute retained mathematical and numerical evidence
        run: |
          python release_evidence/autocorrelation/verify.py
          python release_evidence/runtime/verify.py

      - name: Verify public documentation and release metadata
        run: python scripts/release/check_release.py

  build:
    name: Build distribution
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Resolve tag/version
        id: resolve
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="$REQUESTED_TAG"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(rc[0-9]+)?$ ]] || exit 1
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing tag=$TAG version=$VERSION"

      - name: Verify pyproject version matches tag
        env:
          EXPECTED_VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          python -c "
          import os, sys, tomllib
          from pathlib import Path
          data = tomllib.loads(Path('pyproject.toml').read_text())
          declared = data['project']['version']
          expected = os.environ['EXPECTED_VERSION']
          if declared != expected:
              sys.exit(f'pyproject.toml version {declared!r} != tag version {expected!r}')
          print(f'OK: pyproject version matches tag ({declared})')
          "

      - name: Install validated build tooling
        run: python -m pip install '.[test]' -r scripts/release/requirements-validation.txt

      - name: Build sdist + wheel
        run: python -m build --sdist --wheel --outdir dist/

      - name: Normalize source archive ownership
        run: |
          for archive in dist/*.tar.gz; do
            python scripts/release/normalize_archive_metadata.py "$archive"
          done

      - name: Verify distribution contents and release metadata
        run: python scripts/release/check_release.py --dist dist/

      - name: Show artifacts
        run: ls -lah dist/

      - name: Attest the built distribution artifacts
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'dist/*'

      - name: Upload artifacts for release job
        uses: actions/upload-artifact@v4
        with:
          name: amy-release-${{ steps.resolve.outputs.tag }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.build.outputs.tag }}

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: amy-release-${{ needs.build.outputs.tag }}
          path: dist/

      - name: Extract changelog section
        id: notes
        env:
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        run: |
          python <<'PY' > release_notes.md
          import os, re, sys
          from pathlib import Path
          version = os.environ["RELEASE_VERSION"]
          text = Path("CHANGELOG.md").read_text(encoding="utf-8")
          pattern = re.compile(rf"^## \[{re.escape(version)}\][^\n]*\n(.*?)(?=^## \[|\Z)", re.S | re.M)
          m = pattern.search(text)
          if m:
              print(m.group(1).strip())
          else:
              print(f"Release {version}\n\nSee CHANGELOG.md for details.")
          PY
          echo "Generated release_notes.md:"
          cat release_notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          FLAGS=()
          if [[ "$TAG" == *rc* ]]; then FLAGS+=(--prerelease --draft); fi
          gh release create "$TAG" "${FLAGS[@]}" \
            --title "A.M.Y $TAG" \
            --notes-file release_notes.md \
            dist/*
