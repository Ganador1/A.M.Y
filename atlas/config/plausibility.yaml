# Weights and parameters for plausibility scoring
component_weights:
  title_length: 1.0
  description_length: 1.0
  variables_coverage: 1.0
  quant_elements: 1.0
  assumptions_present: 1.0
  duplication_penalty: 1.0  # applied as a direct multiplier

# Approximate normalized domain weights. Unlisted domains use 1.0
# Multiply the final composite score.
domain_weights:
  biology: 1.05
  chemistry: 1.00
  physics: 1.02
  materials: 1.03
  medicine: 1.04

# Evidence adjustment: multiply the base factor by (1 + alpha * log(1 + evidence_count))
evidence_adjustment:
  enabled: true
  alpha: 0.15
  support_score_weight: 0.5  # equal mixture of support and counts

# Thresholds for plausibility labels
thresholds:
  high: 0.75
  medium: 0.5
